<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="style.css">
  <title>DTA Now Playing</title>
</head>
<body>
  <main id="card">
    <img id="art" alt="">
    <section class="copy">
      <header>
        <div class="label">NOW PLAYING</div>
        <div id="source"></div>
      </header>
      <div id="title">Waiting for music…</div>
      <div id="artist">DTA SIGNAL</div>
      <div id="visualizer" aria-hidden="true"></div>
      <footer>
        <div class="track"><i id="progress"></i></div>
        <div id="time">0:00 / 0:00</div>
      </footer>
    </section>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
